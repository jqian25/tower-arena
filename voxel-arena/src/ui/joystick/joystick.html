<div class="touch-pad" hidden>
  <div class="stick" id="move-stick">
    <div class="knob" id="move-knob"></div>
  </div>
  <div class="touch-actions">
    <button type="button" data-act="swap" aria-label="换枪">换</button>
    <button type="button" data-act="reload" aria-label="换弹">弹</button>
    <button type="button" data-act="mine" aria-label="挖方块">挖</button>
    <button type="button" data-act="place" aria-label="放方块">放</button>
    <button type="button" data-act="block" aria-label="换方块">块</button>
    <button type="button" data-act="scope" aria-label="瞄准镜">镜</button>
    <button type="button" data-act="fire" aria-label="开枪">枪</button>
    <button type="button" data-act="jump" aria-label="跳跃">跳</button>
  </div>
  <button type="button" class="touch-pause" data-act="pause" aria-label="暂停">停</button>
</div>
